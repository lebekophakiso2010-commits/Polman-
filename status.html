<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Status</title>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-storage-compat.js"></script>
<style>body{margin:0;background:#071b34;color:#fff;font-family:system-ui} header{background:#102a4f;padding:12px;display:flex;gap:10px}</style>
</head><body>
<header><button onclick="location.href='./index.html'" style="background:0;border:0;color:#fff;font-size:20px">←</button><b>Status (24h)</b></header>
<div style="padding:12px;background:#102a4f;display:flex;gap:8px"><input id="stText" placeholder="Status text" style="flex:1;padding:12px;border-radius:20px;border:0;background:#0d2241;color:#fff"><button onclick="document.getElementById('stImg').click()" style="background:#1a3a5f;border:0;border-radius:50%;width:44px;height:44px">📷</button><input type="file" id="stImg" accept="image/*" style="display:none"><button onclick="postStatus()" style="background:#00e5ff;border:0;border-radius:20px;padding:0 18px;font-weight:800">Post</button></div>
<div id="list"></div>
<script>
const firebaseConfig = { apiKey: "AIzaSyBPeZKGJy3omJHxgQ7JD6uqcvTP0eqDbrw", authDomain: "polman-7f22f.firebaseapp.com", databaseURL: "https://polman-7f22f-default-rtdb.firebaseio.com", projectId: "polman-7f22f", storageBucket: "polman-7f22f.firebasestorage.app", messagingSenderId: "838743826409", appId: "1:838743826409:web:fca7fea3d701d1aff0b578" };
firebase.initializeApp(firebaseConfig); const auth=firebase.auth(), db=firebase.firestore(), storage=firebase.storage(); let me=null, imgUrl='';
auth.onAuthStateChanged(async u=>{ if(!u) location.href="./login.html"; else { let d=await db.collection('users').doc(u.uid).get(); me=d.data(); load(); } });
document.getElementById('stImg').onchange=async e=>{ let f=e.target.files[0]; if(!f) return; let ref=storage.ref().child('status/'+Date.now()+'.jpg'); await ref.put(f); imgUrl=await ref.getDownloadURL(); alert('Image ready, tap Post'); };
async function postStatus(){ let t=document.getElementById('stText').value.trim(); if(!t &&!imgUrl) return; let exp=new Date(); exp.setHours(exp.getHours()+24); await db.collection('status').add({text:t,photo:me.photoUrl||'',statusImage:imgUrl||'',username:me.username,uid:me.uid,created:firebase.firestore.FieldValue.serverTimestamp(),expireAt:exp}); document.getElementById('stText').value=''; imgUrl=''; }
function load(){ db.collection('status').where('expireAt','>',new Date()).onSnapshot(s=>{ let h=""; s.forEach(d=>{ let st=d.data(); h+=`<div style="display:flex;gap:12px;padding:12px;border-bottom:1px solid #142d51"><img src="${st.photo||'./icon-512.png'}" width="48" style="border-radius:50%;border:2px solid #00e5ff"><div style="flex:1"><b>${st.username}</b><br><small>${st.text||''}</small>${st.statusImage?`<br><img src="${st.statusImage}" style="width:100%;border-radius:10px;margin-top:6px;max-height:300px;object-fit:cover">`:''}</div></div>`; }); document.getElementById('list').innerHTML=h; }); }
</script></body></html>
