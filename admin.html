<style>body{margin:0;background:#071b34;color:#fff;font-family:system-ui;padding:12px}.row{display:flex;gap:10px;padding:10px;border-bottom:1px solid #142d51;align-items:center}</style>
</head><body>
<h2>PolMan Admin - 0731155571</h2><div id="users"></div>
<script>
const firebaseConfig = { apiKey: "AIzaSyBPeZKGJy3omJHxgQ7JD6uqcvTP0eqDbrw", authDomain: "polman-7f22f.firebaseapp.com", databaseURL: "https://polman-7f22f-default-rtdb.firebaseio.com", projectId: "polman-7f22f", storageBucket: "polman-7f22f.firebasestorage.app", messagingSenderId: "838743826409", appId: "1:838743826409:web:fca7fea3d701d1aff0b578" };
firebase.initializeApp(firebaseConfig); const auth=firebase.auth(), db=firebase.firestore();
auth.onAuthStateChanged(async u=>{ if(!u) location.href="./login.html"; else { let d=await db.collection('users').doc(u.uid).get(); let me=d.data(); if(!me.phone.includes('731155571')){ alert('Not admin'); location.href='./index.html'; return; } load(); } });
function load(){ db.collection('users').onSnapshot(s=>{ let h=""; s.forEach(doc=>{ let u=doc.data(); h+=`<div class="row"><div style="flex:1"><b>${u.displayName}</b> @${u.username}<br><small>${u.phone} ${u.banned?'<span style=color:#ff5a5a>BANNED</span>':''}</small></div><button onclick="ban('${doc.id}',${!u.banned})" style="padding:6px 12px;background:${u.banned?'#00e5ff':'#ff3b5a'};border:0;border-radius:10px;color:#fff">${u.banned?'Unban':'Ban'}</button></div>`; }); document.getElementById('users').innerHTML=h; }); }
async function ban(uid,b){ await db.collection('users').doc(uid).update({banned:b}); }
</script></body></html>
