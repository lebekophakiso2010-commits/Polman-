<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Chat</title>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-storage-compat.js"></script>
<style>body{margin:0;font-family:system-ui;background:#071b34;color:#fff;display:flex;flex-direction:column;height:100vh} header{background:#102a4f;padding:10px;display:flex;gap:10px;align-items:center} #msgs{flex:1;overflow:auto;padding:12px;background:#0a1f3a}.msg{max-width:78%;padding:8px 12px;border-radius:14px;margin:6px 0;word-break:break-word}.me{background:#00e5ff;color:#001a2a;margin-left:auto;border-bottom-right-radius:4px}.other{background:#1a3a5f;border-bottom-left-radius:4px} #input{padding:10px;display:flex;gap:8px;background:#102a4f;align-items:center} #input input{flex:1;padding:12px;border-radius:24px;border:0;background:#0d2241;color:#fff} #input button{background:#00e5ff;border:0;border-radius:50%;width:44px;height:44px}.typing{font-size:12px;color:#00e5ff;padding:4px 12px}</style>
</head><body>
<header><button onclick="history.back()" style="background:0;border:0;color:#fff;font-size:22px">←</button><img id="otherPic" src="./icon-512.png" width="36" style="border-radius:50%"><div style="flex:1"><div id="chatName" style="font-weight:700">Chat</div><div id="chatStatus" style="font-size:11px;color:#8fb0d1">30 days auto-delete • E2E</div></div><button onclick="startCall()" style="background:0;border:0;color:#fff;font-size:20px">📹</button></header>
<div id="typing" class="typing" style="display:none">typing...</div><div id="msgs"></div>
<div id="input"><button onclick="document.getElementById('imgPick').click()">📎</button><input type="file" id="imgPick" accept="image/*" style="display:none"><input id="text" placeholder="Message" oninput="setTyping(true)"><button onclick="send()">➤</button></div>
<script>
const firebaseConfig = { apiKey: "AIzaSyBPeZKGJy3omJHxgQ7JD6uqcvTP0eqDbrw", authDomain: "polman-7f22f.firebaseapp.com", databaseURL: "https://polman-7f22f-default-rtdb.firebaseio.com", projectId: "polman-7f22f", storageBucket: "polman-7f22f.firebasestorage.app", messagingSenderId: "838743826409", appId: "1:838743826409:web:fca7fea3d701d1aff0b578" };
firebase.initializeApp(firebaseConfig); const auth=firebase.auth(), db=firebase.firestore(), storage=firebase.storage(); const chatId=new URLSearchParams(location.search).get('id'); let myUid=null, otherUid=null, typingTimeout=null;
auth.onAuthStateChanged(u=>{ if(!u) location.href="./login.html"; else{ myUid=u.uid; listen(); } });
function listen(){ db.collection('chats').doc(chatId).onSnapshot(d=>{ if(!d.exists) return; let c=d.data(); otherUid=c.members.find(x=>x!==myUid); document.getElementById('chatName').textContent=c.otherName||'Chat'; document.getElementById('otherPic').src=c.photo||'./icon-512.png'; if(c.typing && c.typing!==myUid){ document.getElementById('typing').style.display='block'; } else { document.getElementById('typing').style.display='none'; } }); db.collection('chats').doc(chatId).collection('messages').orderBy('time').onSnapshot(s=>{ let h=""; s.forEach(doc=>{ let m=doc.data(); let isMe=m.sender===myUid; h+=`<div class="msg ${isMe?'me':'other'}">${m.image?`<img src="${m.image}" style="max-width:100%;border-radius:10px"><br>`:''}${m.text||''}<br><small style="font-size:10px;opacity:.7">${m.time?.toDate?new Date(m.time.toDate()).toLocaleTimeString():''} ${isMe?(m.read?'✓✓':'✓'):''}</small></div>`; }); document.getElementById('msgs').innerHTML=h; document.getElementById('msgs').scrollTop=99999; }); }
function setTyping(v){ clearTimeout(typingTimeout); if(v) db.collection('chats').doc(chatId).update({typing:myUid}); typingTimeout=setTimeout(()=>{ db.collection('chats').doc(chatId).update({typing:firebase.firestore.FieldValue.delete()}); },1500); }
async function send(){ let t=document.getElementById('text').value.trim(); if(!t &&!window._pendingImage) return; let img=window._pendingImage||null; window._pendingImage=null; document.getElementById('text').value=""; setTyping(false); let expire=new Date(); expire.setDate(expire.getDate()+30); await db.collection('chats').doc(chatId).collection('messages').add({text:t,image:img||'',sender:myUid,time:firebase.firestore.FieldValue.serverTimestamp(),read:false,expireAt:expire}); await db.collection('chats').doc(chatId).update({lastMessage:t||'📷 Image',lastTime:new Date().toLocaleTimeString(),lastTimeSort:Date.now()}); }
document.getElementById('imgPick').onchange=async e=>{ let f=e.target.files[0]; if(!f) return; let ref=storage.ref().child('chat_images/'+chatId+'/'+Date.now()+'.jpg'); await ref.put(f); let url=await ref.getDownloadURL(); window._pendingImage=url; await send(); };
document.getElementById('text').addEventListener('keydown',e=>{ if(e.key==='Enter') send(); });
function startCall(){ location.href='./calls.html?chat='+chatId; }
</script></body></html>
