<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>PolMan Login</title>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<style>body{margin:0;background:#071b34;color:#fff;font-family:system-ui;display:flex;justify-content:center;padding:20px}.card{background:#132a4a;width:100%;max-width:380px;padding:22px;border-radius:16px} input{width:100%;padding:13px;margin:6px 0;border-radius:10px;border:1px solid #244166;background:#0d2241;color:#fff}.btn{width:100%;padding:13px;background:#00e5ff;border:0;border-radius:10px;font-weight:800}</style>
</head><body><div class="card">
<img src="./icon-512.png" width="70" style="display:block;margin:auto;border-radius:16px">
<h2 style="text-align:center">PolMan Login</h2>
<input id="user" placeholder="Username or Phone +266..." autocomplete="off">
<input id="pass" type="password" placeholder="Password">
<button class="btn" onclick="login()">Log In</button>
<p style="text-align:center;font-size:13px"><a href="./signup.html" style="color:#00e5ff">Create account</a></p>
</div><script>
const firebaseConfig = { apiKey: "AIzaSyBPeZKGJy3omJHxgQ7JD6uqcvTP0eqDbrw", authDomain: "polman-7f22f.firebaseapp.com", databaseURL: "https://polman-7f22f-default-rtdb.firebaseio.com", projectId: "polman-7f22f", storageBucket: "polman-7f22f.firebasestorage.app", messagingSenderId: "838743826409", appId: "1:838743826409:web:fca7fea3d701d1aff0b578" };
firebase.initializeApp(firebaseConfig); const auth=firebase.auth(), db=firebase.firestore();
async function login(){ let u=document.getElementById('user').value.trim().toLowerCase(); let p=document.getElementById('pass').value; let email; if(u.startsWith('+')||u.startsWith('0')){ let d=await db.collection('phones').doc(u).get(); if(!d.exists) return alert("Phone not found"); email=d.data().username+"@polman.chat"; } else { email=u+"@polman.chat"; } await auth.signInWithEmailAndPassword(email,p); location.href="./index.html"; }
</script></body></html>
